name: Verify

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  c-format:
    name: Check C formatting
    runs-on: ubuntu-24.04
    steps:
      - name: Check out the source
        uses: actions/checkout@v6

      - name: Check the format configuration and C sources
        shell: bash
        run: |
          clang-format-18 --style=file --dump-config > /dev/null
          mapfile -d '' files < <(git ls-files -z -- '*.c' '*.h')
          if (( ${#files[@]} == 0 )); then
            echo "No C or header files are tracked."
            exit 0
          fi
          clang-format-18 --style=file --dry-run --Werror "${files[@]}"

  extension:
    name: Test the extension
    runs-on: ubuntu-24.04
    env:
      PG_CONFIG: /usr/lib/postgresql/16/bin/pg_config
    steps:
      - name: Check out the source
        uses: actions/checkout@v6

      - name: Install PostgreSQL build files
        run: |
          sudo apt-get update
          sudo apt-get install --yes postgresql-server-dev-16

      - name: Start PostgreSQL
        run: |
          sudo systemctl start postgresql
          sudo -u postgres createuser --superuser "$USER"

      - name: Build and install the extension
        run: |
          make
          sudo env PG_CONFIG="$PG_CONFIG" make install

      - name: Run the package regression test
        run: make installcheck

  documentation:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the complete history
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-docs.txt

      - name: Install documentation tools
        run: python -m pip install --requirement requirements-docs.txt

      - name: Build the current documentation
        run: python -m mkdocs build --strict

      - name: Build a local Pages preview
        run: python scripts/build_pages.py --include-worktree --output _site-preview
