name: Publish release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag, for example v0.1.0
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    env:
      PG_CONFIG: /usr/lib/postgresql/16/bin/pg_config
    steps:
      - name: Check out the complete history
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Select and check the release
        id: release
        shell: bash
        env:
          REQUESTED_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail

          tag="$GITHUB_REF_NAME"
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            tag="$REQUESTED_TAG"
          fi
          if [[ ! "$tag" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "Release tag must have the form vMAJOR.MINOR.PATCH." >&2
            exit 1
          fi
          if ! git show-ref --verify --quiet "refs/tags/$tag"; then
            echo "Release tag does not exist: $tag" >&2
            exit 1
          fi

          git checkout --detach "refs/tags/$tag"
          version="${tag#v}"
          source_commit="$(git rev-list -n 1 "$tag")"
          notes="docs/releases/$version.md"

          test "$(tr -d '\n' < VERSION)" = "$version"
          test -f "$notes"
          test "$(sed -n "s/^default_version = '\([^']*\)'$/\1/p" jsonb_slice.control)" = "$version"
          test "$(jq -er '.current' release-plan.json)" = "$version"
          milestone="$(
            jq -er --arg version "$version" \
              '.releases[] | select(.version == $version and .state == "released") | .title' \
              release-plan.json
          )"

          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "source_commit=$source_commit" >> "$GITHUB_OUTPUT"
          echo "notes=$notes" >> "$GITHUB_OUTPUT"
          echo "title=jsonb_slice $version — $milestone" >> "$GITHUB_OUTPUT"

      - name: Install PostgreSQL build files
        run: |
          sudo apt-get update
          sudo apt-get install --yes postgresql-server-dev-16

      - name: Start PostgreSQL
        run: |
          sudo systemctl start postgresql
          sudo -u postgres createuser --superuser "$USER"

      - name: Test the release package
        run: |
          make
          sudo env PG_CONFIG="$PG_CONFIG" make install
          make installcheck

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-docs.txt

      - name: Test the release documentation
        run: |
          python -m pip install --requirement requirements-docs.txt
          python -m mkdocs build --strict

      - name: Prepare the release files
        id: files
        shell: bash
        env:
          TAG: ${{ steps.release.outputs.tag }}
          VERSION: ${{ steps.release.outputs.version }}
          SOURCE_COMMIT: ${{ steps.release.outputs.source_commit }}
          NOTES: ${{ steps.release.outputs.notes }}
        run: |
          set -euo pipefail

          mkdir dist
          archive="dist/jsonb_slice-$VERSION.tar.gz"
          checksum="$archive.sha256"
          body="dist/release-notes.md"

          git archive \
            --format=tar.gz \
            --prefix="jsonb_slice-$VERSION/" \
            --output="$archive" \
            "$TAG"
          sha256sum "$archive" > "$checksum"

          cp "$NOTES" "$body"
          printf '\n---\n\n' >> "$body"
          printf 'Source commit: [`%s`](https://github.com/%s/commit/%s)\n\n' \
            "$SOURCE_COMMIT" "$GITHUB_REPOSITORY" "$SOURCE_COMMIT" >> "$body"

          echo "archive=$archive" >> "$GITHUB_OUTPUT"
          echo "checksum=$checksum" >> "$GITHUB_OUTPUT"
          echo "body=$body" >> "$GITHUB_OUTPUT"

      - name: Create or refresh the release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
          TITLE: ${{ steps.release.outputs.title }}
          ARCHIVE: ${{ steps.files.outputs.archive }}
          CHECKSUM: ${{ steps.files.outputs.checksum }}
          BODY: ${{ steps.files.outputs.body }}
        run: |
          set -euo pipefail

          if release="$(gh release view "$TAG" --json isDraft 2>/dev/null)"; then
            is_draft="$(jq -r '.isDraft' <<< "$release")"
            gh release edit "$TAG" \
              --verify-tag \
              --title "$TITLE" \
              --notes-file "$BODY"
            gh release upload "$TAG" "$ARCHIVE" "$CHECKSUM" --clobber
            if [[ "$is_draft" == "true" ]]; then
              gh release edit "$TAG" --draft=false --latest
            fi
          else
            gh release create "$TAG" "$ARCHIVE" "$CHECKSUM" \
              --verify-tag \
              --title "$TITLE" \
              --notes-file "$BODY" \
              --draft
            gh release edit "$TAG" --draft=false --latest
          fi
