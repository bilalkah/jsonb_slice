site_name: jsonb_slice
site_description: >-
  A PostgreSQL extension experiment that reads one field from a large jsonb
  value without reading the complete value.
site_author: Bilal Kahraman
site_url: !ENV [JSONB_SLICE_SITE_URL, "http://127.0.0.1:8000/"]
repo_url: https://github.com/bilalkah/jsonb_slice
repo_name: bilalkah/jsonb_slice
copyright: Copyright &copy; 2026 Bilal Kahraman. PostgreSQL License.

docs_dir: docs
site_dir: site

theme:
  name: material
  language: en
  font: false
  features:
    - content.code.copy
    - navigation.footer
    - navigation.indexes
    - navigation.sections
    - navigation.top
    - search.highlight
    - search.suggest
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: jsonb-light
      toggle:
        icon: material/weather-night
        name: Use dark colors
    - media: "(prefers-color-scheme: dark)"
      scheme: jsonb-dark
      toggle:
        icon: material/weather-sunny
        name: Use light colors
  icon:
    repo: fontawesome/brands/github

extra_css:
  - stylesheets/extra.css

plugins:
  - search

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - toc:
      permalink: true

validation:
  omitted_files: warn
  absolute_links: warn
  unrecognized_links: warn
  anchors: warn

extra:
  version:
    provider: mike
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/bilalkah
      name: Bilal Kahraman on GitHub
    - icon: fontawesome/brands/linkedin
      link: https://www.linkedin.com/in/bilalkah/
      name: Bilal Kahraman on LinkedIn

nav:
  - Start: index.md
  - Install 0.1.0: getting-started.md
  - The experiment:
      - Problem: problem.md
  - Project:
      - Repository map: repository-map.md
      - Terms: terms.md
  - Releases:
      - 0.1.0: releases/0.1.0.md
